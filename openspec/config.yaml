schema: spec-driven

context: |
  Project: claude-plan-api
  Runtime: Bun (bun:test, Bun.serve, bun:sqlite)
  Language: TypeScript (strict ESNext, moduleResolution: bundler)
  Architecture: Hexagonal-lite — domain/, http/routes/, upstream/, transform/, observability/
  Testing: bun test — 422/422 pass (0 fail); type-check via `bun run tsc --noEmit`
  Conventions: CLAUDE.md mandates Bun over Node; no express/jest/vitest; pino for logging

strict_tdd: true
test_command: bun test

testing:
  runner: bun test
  framework: bun:test
  unit:
    available: true
    tool: bun:test
  integration:
    available: true
    tool: bun:test (HTTP route handlers tested via direct function calls + fetch mocks)
  e2e:
    available: false
  coverage:
    available: false
    note: bun test has no built-in coverage flag yet; c8/istanbul not configured
  quality:
    linter: false
    type_checker: true
    # Root tsc excludes src/ui (it's a separate Vite project, see tsconfig.json)
    # — it alone can NEVER catch a src/ui-only type error. The dashboard-
    # performance-2 incident (2026-07-11): a widened RequestRecord type broke
    # src/ui's own `tsc -b` production build, causing a prod outage, because
    # every verify/review step in that change only ran the root command below.
    # Both commands are REQUIRED for a clean type-check claim. Use `;`, NOT
    # `&&` — root tsc has a documented pre-existing non-zero baseline (see
    # README "known pre-existing errors"), so `&&` would short-circuit and
    # silently never run the UI check at all. Compare each command's own
    # output against its own baseline; do not treat this as one combined
    # pass/fail exit code.
    command: bun run tsc --noEmit; (cd src/ui && bun run typecheck)
    formatter: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Respect Bun-first conventions from CLAUDE.md
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - No express/jest/vitest — Bun native APIs only
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (bun:test spyOn, fetch mocks)
    tdd: true
    test_command: bun test
  verify:
    test_command: bun test
    # `;` not `&&` — see quality.command comment above: root tsc's known
    # pre-existing baseline errors would short-circuit an `&&` chain and
    # silently skip the src/ui typecheck. Run and check both independently.
    build_command: bun run tsc --noEmit; (cd src/ui && bun run typecheck)
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
